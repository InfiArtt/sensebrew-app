name: v60_blind_guide
description: A new Flutter project for V60 audio guide.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  audioplayers: ^5.2.1
  http: ^1.2.0
  flutter_tts: ^3.8.3
  speech_to_text: ^7.4.0
  record: ^6.2.1
  path_provider: ^2.1.5
  wakelock_plus: 1.2.8
  soundpool: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
